name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bash agents/format-check

      - name: Lint (auto-fix) and typecheck
        run: bash dev/lint

      - name: Style check
        run: bash agents/style-check --all

      - name: Tests with coverage
        run: bash dev/test

      - name: Coverage report (lcov)
        run: bash agents/coverage-report

      - name: Per-file coverage gate
        run: bash agents/check-coverage
