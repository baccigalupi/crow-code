name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Typecheck
        run: deno task typecheck

      - name: Lint
        run: deno lint

      - name: Format check
        run: deno fmt --check

      - name: Tests with coverage
        run: deno test --coverage --allow-env --allow-read --allow-write

      - name: Coverage report
        run: deno coverage --lcov --output coverage/lcov.info

      - name: Per-file coverage gate
        run: bash agents/check-coverage.sh
