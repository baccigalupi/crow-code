name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Format check
        run: bash agents/format-check

      - name: Lint (auto-fix) and typecheck
        run: bash dev/lint

      - name: Tests with coverage
        run: bash dev/test

      - name: Coverage report (lcov)
        run: bash agents/coverage-report

      - name: Per-file coverage gate
        run: bash agents/check-coverage.sh
